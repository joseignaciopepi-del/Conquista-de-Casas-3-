<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conquista de Casas3</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1e1e1e; color: #fff; margin: 15px; }
        #tablero { display: grid; grid-template-columns: repeat(10, 38px); gap: 2px; justify-content: center; margin: 15px auto; }
        .casilla { width: 38px; height: 38px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 4px; }
        button { padding: 8px 15px; font-size: 15px; cursor: pointer; border-radius: 4px; border: none; background: #28a745; color: white; margin: 4px; }
        .btn-dir { background: #007bff; width: 45px; height: 45px; font-size: 18px; }
        .controles-dir { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Conquista de Casas (10x10)</h2>
    <p>Turno: <b id="turno">Jugador 1 🔵</b> | P1: <span id="p1">0</span> 🏠 | P2: <span id="p2">0</span> 🏠</p>
    
    <div id="tablero"></div>
    
    <button onclick="lanzarDado()">Lanzar Dado (1-3)</button>
    <h3 id="dado">Dado: -</h3>

    <!-- Botones de dirección para mover la ficha -->
    <div class="controles-dir">
        <button class="btn-dir" onclick="mover('ARRIBA')">⬆️</button><br>
        <button class="btn-dir" onclick="mover('IZQUIERDA')">⬅️</button>
        <button class="btn-dir" onclick="mover('ABAJO')">⬇️</button>
        <button class="btn-dir" onclick="mover('DERECHA')">➡️</button>
    </div>

    <script>
        const N = 10;
        let p1 = [{x: 0, y: 0}], p2 = [{x: 9, y: 9}], casas = [], turnoP1 = true, dado = 0;
        let scoreP1 = 0, scoreP2 = 0;
        let jugandoBot = false;

        function init() {
            casas = [];
            scoreP1 = 0;
            scoreP2 = 0;
            turnoP1 = true;
            dado = 0;
            jugandoBot = false;
            p1 = [{x: 0, y: 0}];
            p2 = [{x: 9, y: 9}];

            while (casas.length < 5) {
                let x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
                if ((x !== 0 || y !== 0) && (x !== 9 || y !== 9) && !casas.some(c => c.x === x && c.y === y)) {
                    casas.push({x, y});
                }
            }
            dibujar();
        }

        function dibujar() {
            let html = '';
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    let txt = '';
                    if (p1.some(f => f.x === x && f.y === y)) txt = '🔵';
                    else if (p2.some(f => f.x === x && f.y === y)) txt = '🔴';
                    else if (casas.some(c => c.x === x && c.y === y)) txt = '🏠';
                    html += `<div class="casilla">${txt}</div>`;
                }
            }
            document.getElementById('tablero').innerHTML = html;
            document.getElementById('p1').innerText = scoreP1;
            document.getElementById('p2').innerText = scoreP2;
        }

        function lanzarDado() {
            if (!turnoP1 || dado !== 0 || jugandoBot) return;
            dado = Math.floor(Math.random() * 3) + 1;
            document.getElementById('dado').innerText = `Dado: ${dado}`;
        }

        function mover(direccion) {
            if (!turnoP1 || dado === 0 || jugandoBot) return;

            // 1. Mover ficha del Jugador 1
            aplicarMovimiento(p1[0], direccion, dado);

            // Revisa si conquisto una casa
            let idx = casas.findIndex(c => c.x === p1[0].x && c.y === p1[0].y);
            if (idx !== -1) {
                casas.splice(idx, 1);
                scoreP1++;
            }

            dado = 0;
            document.getElementById('dado').innerText = 'Dado: -';
            dibujar();

            if (verificarFinJuego()) return;

            // 2. Pasar turno al Bot
            turnoP1 = false;
            jugandoBot = true;
            document.getElementById('turno').innerText = 'Turno del Bot 🔴';

            setTimeout(turnoDelBot, 800);
        }

        function turnoDelBot() {
            let dadoBot = Math.floor(Math.random() * 3) + 1;
            document.getElementById('dado').innerText = `Dado (Bot): ${dadoBot}`;

            setTimeout(() => {
                const dirs = ['ARRIBA', 'ABAJO', 'IZQUIERDA', 'DERECHA'];
                const dirBot = dirs[Math.floor(Math.random() * dirs.length)];
                
                aplicarMovimiento(p2[0], dirBot, dadoBot);

                let idx = casas.findIndex(c => c.x === p2[0].x && c.y === p2[0].y);
                if (idx !== -1) {
                    casas.splice(idx, 1);
                    scoreP2++;
                }

                if (verificarFinJuego()) return;

                turnoP1 = true;
                jugandoBot = false;
                document.getElementById('dado').innerText = 'Dado: -';
                document.getElementById('turno').innerText = 'Jugador 1 🔵';
                dibujar();
            }, 600);
        }

        function aplicarMovimiento(ficha, direccion, pasos) {
            if (direccion === 'ARRIBA') ficha.y = (ficha.y - pasos + N) % N;
            if (direccion === 'ABAJO') ficha.y = (ficha.y + pasos) % N;
            if (direccion === 'IZQUIERDA') ficha.x = (ficha.x - pasos + N) % N;
            if (direccion === 'DERECHA') ficha.x = (ficha.x + pasos) % N;
        }

        function verificarFinJuego() {
            if (casas.length === 0) {
                let msg = scoreP1 > scoreP2 ? '¡Ganaste!' : (scoreP2 > scoreP1 ? '¡Ganó el Bot!' : '¡Empate!');
                alert(`Juego terminado. ${msg}\nMarcador final - P1: ${scoreP1} | Bot: ${scoreP2}`);
                return true;
            }
            return false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') mover('ARRIBA');
            if (e.key === 'ArrowDown') mover('ABAJO');
            if (e.key === 'ArrowLeft') mover('IZQUIERDA');
            if (e.key === 'ArrowRight') mover('DERECHA');
        });

        init();
    </script>
</body>
</html>
